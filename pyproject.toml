[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-dreamer-navigation"
version = "0.1.0"
description = "A minimal, reproducible PyBullet UAV navigation environment."
requires-python = ">=3.10"
dependencies = ["gymnasium>=0.29", "numpy>=1.24", "pybullet>=3.2"]

[project.scripts]
uav-sim = "uav_navigation.simulate:main"
uav-visualize = "uav_navigation.visualize:main"
uav-train-ppo = "uav_navigation.train_ppo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
